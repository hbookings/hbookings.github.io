<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>Mensaje enviado | Hotel Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}body{min-height:100vh;background:#f5f7fb;color:#333;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #e8edf5;border-radius:14px;padding:clamp(28px,6vw,48px);text-align:center;box-shadow:0 8px 28px rgba(25,55,95,.09)}.mark{width:70px;height:70px;border-radius:50%;background:#e8f6ee;color:#23834d;display:grid;place-items:center;font-size:38px;margin:0 auto 22px}h1{color:#15438B;font-size:clamp(25px,4vw,32px);margin-bottom:14px}p{color:#606775;line-height:1.8;font-size:15px;margin-bottom:24px}.btn{display:inline-block;background:#e67e22;color:white;text-decoration:none;padding:12px 22px;border-radius:6px;font-weight:600;font-size:14px}.btn:hover{background:#cf6d17}.brand{margin-top:28px;color:#15438B;font-size:12px;font-weight:600;letter-spacing:.5px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">✓</div>
    <h1>¡Gracias por contactar con nosotros!</h1>
    <p>Tu mensaje se ha enviado correctamente. En Hotel Bookings agradecemos tu interés y nos pondremos en contacto contigo lo antes posible.</p>
    <a class="btn" href="index.es.html">Volver a la página de inicio</a>
    <div class="brand">HOTEL BOOKINGS</div>
  </main>
</body>
</html>
