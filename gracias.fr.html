<head>

  <title>Merci pour votre message | Hotel Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
    body{background:#f5f7fb;color:#333;min-height:100vh;display:flex;flex-direction:column}
    header{background:#15438B;padding:10px 20px}.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .logo img{display:block;width:210px;max-width:60vw;height:auto}.home{color:#fff;text-decoration:none;font-size:14px;padding:10px 14px;border:1px solid rgba(255,255,255,.45);border-radius:5px}
    main{width:min(700px,calc(100% - 32px));margin:auto;padding:60px 0;flex:1}.card{background:#fff;padding:clamp(26px,5vw,46px);border-radius:12px;box-shadow:0 8px 28px rgba(25,55,95,.09);border:1px solid #e8edf5;text-align:center}
    .check{font-size:48px;color:#e67e22;margin-bottom:16px}h1{font-size:clamp(27px,4vw,36px);line-height:1.25;color:#15438B;margin-bottom:16px}p{font-size:15px;line-height:1.8;color:#606775}
    .btn{display:inline-block;margin-top:26px;padding:13px 22px;background:#e67e22;color:#fff;text-decoration:none;border-radius:6px;font-weight:600}.btn:hover{background:#cf6d17}
    footer{background:#15438B;color:#fff;text-align:center;padding:22px 16px;font-size:12px;line-height:1.8}footer p{color:#fff;font-size:12px;margin:0}
    @media(max-width:600px){.logo img{width:165px}.home{font-size:12px;padding:8px 10px}main{padding:35px 0}}

</head>

  <header><div class="nav"><a class="logo" href="index.fr.html" aria-label="Hotel Bookings, accueil"><img src="images/hb.png" alt="Hotel Bookings"></a><a class="home" href="index.fr.html">← Retour à l’accueil</a></div></header>
  <main><section class="card"><div class="check" aria-hidden="true">✓</div><h1>Merci d’avoir contacté Hotel Bookings !</h1><p>Votre message a bien été envoyé. Nous vous répondrons dans les meilleurs délais.</p><a class="btn" href="index.fr.html">Retour à l’accueil</a></section></main>
  <footer><p>© 2026 Hotel Bookings · Tous droits réservés</p></footer>
</body>
